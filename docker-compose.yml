services:
  # FastAPI Backend Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workshop1-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PROJECT_NAME=${PROJECT_NAME:-Restaurant Review Insights API}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - HUGGINGFACE_TTS_MODEL=${HUGGINGFACE_TTS_MODEL:-facebook/mms-tts-eng}
      - HUGGINGFACE_TTS_API_URL=${HUGGINGFACE_TTS_API_URL:-https://router.huggingface.co/hf-inference/models}
      - TTS_BASE_URL=${TTS_BASE_URL:-}
      - TTS_MODEL=${TTS_MODEL:-kokoro}
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - AUTH_BOOTSTRAP_KEY=${AUTH_BOOTSTRAP_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]}
      - COMPETITOR_MIN_SUGGESTIONS=${COMPETITOR_MIN_SUGGESTIONS:-5}
      - COMPETITOR_MAX_SUGGESTIONS=${COMPETITOR_MAX_SUGGESTIONS:-10}
      - MIN_REVIEWS_PER_CRITERION=${MIN_REVIEWS_PER_CRITERION:-3}
      - GAP_TIE_MARGIN=${GAP_TIE_MARGIN:-0.3}
      - GAP_WEAK_COMPETITOR_AVG=${GAP_WEAK_COMPETITOR_AVG:-3.5}
    volumes:
      # Bind mount the api directory for instant code hot-reloading
      - ./api:/app
      # Anonymous volume prevents host .venv from clashing with container dependencies
      - /app/.venv
      # Anonymous volume prevents bytecode cache files from polluting host
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Database Seeding Utility Service (Run with: docker compose run --rm seed)
  seed:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workshop1-seed
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    command: python seed.py
    profiles:
      - tools

  # Review Embedding Backfill Service (Run with: docker compose run --rm backfill-embeddings)
  backfill-embeddings:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workshop1-backfill-embeddings
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    entrypoint: ["python", "backfill_embeddings.py"]
    profiles:
      - tools

  # Unit Test Runner Service (Run with: docker compose run --rm test)
  test:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: workshop1-test
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./api:/app
      - /app/.venv
      - /app/__pycache__
    command: python -m unittest discover -s tests -v
    profiles:
      - tools

  # Frontend Service (React + Vite Client UI)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workshop1-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      # Bind mount frontend source for live hot-reloading
      - ./frontend:/app
      # Anonymous volume prevents host node_modules from conflicting with container
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
